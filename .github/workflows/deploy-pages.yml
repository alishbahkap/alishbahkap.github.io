name: Deploy to GitHub Pages

# Deploys automatically on every push to main.
# Can also be started by hand: Actions tab → this workflow → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # A repo named <owner>.github.io is served from the root of the domain;
      # any other repo name is served from /<repo-name>.
      - name: Work out the site address
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          if [ "$repo" = "$owner.github.io" ]; then base=""; else base="/$repo"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$owner.github.io$base" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: 'true'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
